name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you were doing when it happened.
      placeholder: RepoSpend did...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect RepoSpend to do instead?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true

  - type: input
    id: repospend-version
    attributes:
      label: RepoSpend version
      placeholder: "0.0.2"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.11.0"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "macOS 15.5, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or add screenshots. Remove private data such as repo names, usernames, access tokens, paths, or usage details you do not want to share.
    validations:
      required: false
