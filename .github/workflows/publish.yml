name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Check and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Show tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Build GitHub release notes
        id: release-notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          awk -v version="$version" '
            $0 ~ "^##[[:space:]]+" version "([[:space:]]|$)" { in_section = 1; found = 1; next }
            in_section && /^##[[:space:]]+/ { exit }
            in_section { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "CHANGELOG.md section for $version is empty." >&2
            exit 1
          fi

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
        run: |
          title="RepoSpend ${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
